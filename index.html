<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolecciona Concepción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600;700&display=swap">
<style>
/* Layout: archivo digital de boletos como app de teléfono (máx. 430px). Cinco pestañas (Inicio, Catálogo, Añadir, Comunidad, Perfil) y pantallas apiladas encima. Tema oscuro único, como la propuesta visual. */
:root {
  --bg: #06122a;
  --surface: #0d2140;
  --surface2: #14305a;
  --line: #1d3a63;
  --fg: #e9f2fb;
  --muted: #8ca4bf;
  --accent: #33c6f2;
  --accent-ink: #04202d;
  --good: #4ade80;
  --warn: #f5b73d;
  --bad: #ff7a70;
  --f-display: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

#app { width: 100%; max-width: 430px; height: 100%; display: flex; flex-direction: column; position: relative; min-width: 0; }
#main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: 10px; }
#main::-webkit-scrollbar { display: none; }

nav { margin: 6px 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; display: flex; padding: 6px; gap: 2px; }
nav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 14px; color: var(--muted); font-size: 10px; font-weight: 500; }
nav button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="true"] { color: var(--accent); background: var(--surface2); }

.wordmark { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .2em; line-height: 1.15; }
.wordmark span { display: block; color: var(--accent); font-weight: 400; letter-spacing: .5em; font-size: .78em; }
h1 { font-family: var(--f-display); font-size: 21px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.top { display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
.top h1 { flex: 1; min-width: 0; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; }
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; font-size: 12px; }
.brand svg { width: 34px; height: 34px; flex: none; }

.search { position: relative; display: block; margin-bottom: 14px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.search input { width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; padding: 0 14px 0 40px; }
input::placeholder, textarea::placeholder { color: var(--muted); }

.banner { position: relative; width: 100%; height: 118px; border-radius: 18px; overflow: hidden; background: var(--surface2); display: block; margin-bottom: 12px; }
.banner .c { position: absolute; width: 74px; }
.banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,18,42,.94) 12%, rgba(6,18,42,.12)); }
.banner .t { position: absolute; z-index: 1; left: 16px; bottom: 14px; right: 50px; font-family: var(--f-display); font-weight: 600; font-size: 16px; line-height: 1.25; }
.banner .go { position: absolute; z-index: 1; right: 12px; bottom: 14px; width: 26px; height: 26px; border-radius: 50%; background: rgba(6,18,42,.6); display: grid; place-items: center; }
.banner .go svg { width: 14px; height: 14px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.notice { display: flex; gap: 10px; padding: 11px 13px; border-radius: 14px; background: rgba(245,183,61,.1); border: 1px solid rgba(245,183,61,.35); color: #f7d890; font-size: 12.5px; margin-bottom: 16px; }
.notice b { color: var(--warn); font-weight: 700; }

.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 10px; }
.sec button { color: var(--accent); font-size: 12px; }
.strip { display: flex; gap: 12px; overflow-x: auto; margin: 0 -2px 16px; padding: 2px 2px 6px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.feat { flex: none; width: 120px; display: flex; flex-direction: column; gap: 5px; }
.feat b { font-weight: 500; font-size: 13px; }
.feat small { color: var(--muted); font-size: 11.5px; margin-top: -3px; }

.card { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card svg { width: 100%; height: auto; border-radius: 8px; }
.card b { font-weight: 500; font-size: 13px; }
.card small { color: var(--muted); font-size: 11.5px; margin-top: -4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 14px; padding-bottom: 8px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.seg button { text-align: center; padding: 9px 0; border-radius: 10px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 500; }

.fbar { display: flex; gap: 8px; margin-bottom: 10px; }
.fbar .grow { flex: 1; }
.fpanel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
label.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
select, input[type="text"], textarea { width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; padding: 0 12px; height: 42px; }
textarea { height: auto; min-height: 78px; padding: 10px 12px; resize: vertical; }
.cnt { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.active { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.active button { padding: 5px 10px; border-radius: 999px; background: var(--surface2); font-size: 12px; }

.bd { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.bd.ok { background: rgba(74,222,128,.14); color: var(--good); }
.bd.est { background: rgba(245,183,61,.15); color: var(--warn); }
.bd.pend { border: 1px dashed var(--muted); color: var(--muted); }
.bd.rev { background: rgba(51,198,242,.15); color: var(--accent); }
.bd.res { background: rgba(74,222,128,.14); color: var(--good); }
.bd.ab { background: rgba(245,183,61,.15); color: var(--warn); }

.hero { padding: 2px 0 12px; }
.hero svg { width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.hero .tag { margin-top: 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
.info { margin: 12px 0 12px; }
.info > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.info > div > span:first-child { color: var(--muted); flex: none; }
.info .v { display: flex; align-items: center; gap: 8px; justify-content: flex-end; text-align: right; min-width: 0; flex-wrap: wrap; }
.info .v i { font-style: italic; color: var(--muted); }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

.btn { width: 100%; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; text-align: center; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.warn { background: #e0524a; color: #fff; }
.btns { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.btns.row2 { flex-direction: row; }

.note { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.note p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.note .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.empty { text-align: center; padding: 34px 12px; color: var(--muted); }
ul.plain { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
ul.plain li { margin-bottom: 4px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; }
.row:first-child { border-top: 0; }
.row .th { width: 52px; flex: none; }
.row .th svg { width: 100%; height: auto; border-radius: 6px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 500; font-size: 14.5px; }
.row .tx small { display: block; color: var(--muted); font-size: 12px; }
.row > svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.form { display: flex; flex-direction: column; gap: 12px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.drop { position: relative; display: grid; place-items: center; text-align: center; aspect-ratio: 180 / 170; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; overflow: hidden; cursor: pointer; padding: 8px; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.msg { font-size: 13px; padding: 10px 12px; border-radius: 12px; }
.msg.err { background: rgba(255,122,112,.12); color: var(--bad); }
.msg.good { background: rgba(74,222,128,.12); color: var(--good); }
.copyline { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; margin-top: 10px; user-select: all; }
.copyline button { color: var(--accent); font-size: 12.5px; flex: none; user-select: none; }
.phase { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.phase:first-of-type { border-top: 0; }
.phase em { font-style: normal; font-family: var(--f-display); font-weight: 600; color: var(--accent); width: 18px; flex: none; }
.phase span { color: var(--muted); display: block; font-size: 12.5px; }

#toast { position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 12px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 92%; text-align: center; z-index: 5; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#splash { position: fixed; inset: 0; z-index: 10; display: flex; justify-content: center; background: linear-gradient(180deg, #0a1d45 0%, #1b3f78 42%, #e0875a 78%, #f0b078 100%); transition: opacity .35s; }
#splash.gone { opacity: 0; pointer-events: none; }
#splash .in { position: relative; width: 100%; max-width: 430px; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: calc(env(safe-area-inset-top, 0px) + 12vh); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
#splash .logo { width: 64px; height: 64px; margin-bottom: 16px; }
#splash .wordmark { font-size: 26px; }
#splash p { margin: 14px 0 0; color: #dbe8f7; font-size: 14px; max-width: 230px; }
#splash .sky { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; }
#splash .enter { position: relative; z-index: 1; margin-top: auto; width: 100%; max-width: 280px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-align: center; font-family: var(--f-display); letter-spacing: .06em; font-size: 14px; }
#splash small { position: relative; z-index: 1; margin-top: 12px; color: #1a2d4d; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; text-align: center; }
@media (prefers-reduced-motion: reduce) { #splash, #toast { transition: none; } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="main"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="nav" aria-label="Secciones"></nav>
</div>

<div id="splash">
  <div class="in">
    <svg class="sky" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <polygon points="0,200 0,120 40,104 90,126 140,112 200,138 260,118 320,96 370,84 400,98 400,200" fill="#0d2447"/>
      <polygon points="0,200 0,150 60,140 130,152 210,144 290,154 360,146 400,152 400,200" fill="#081935"/>
      <g stroke="#0a1b3a" stroke-width="3" fill="none"><path d="M20 150 V118 H48 M34 118 V104"/><path d="M70 152 V124 H96"/></g>
      <rect x="0" y="168" width="400" height="32" fill="#060f22"/>
      <g>
        <rect x="104" y="128" width="136" height="38" rx="7" fill="#e9f2fb"/>
        <rect x="104" y="148" width="136" height="9" fill="#2a7fc0"/>
        <rect x="112" y="134" width="22" height="13" rx="2" fill="#1b3f78"/><rect x="140" y="134" width="22" height="13" rx="2" fill="#1b3f78"/><rect x="168" y="134" width="22" height="13" rx="2" fill="#1b3f78"/><rect x="196" y="134" width="22" height="13" rx="2" fill="#1b3f78"/>
        <rect x="224" y="134" width="12" height="22" rx="2" fill="#1b3f78"/>
        <circle cx="136" cy="168" r="9" fill="#0b1630"/><circle cx="210" cy="168" r="9" fill="#0b1630"/>
        <rect x="236" y="152" width="5" height="5" rx="2" fill="#ffd479"/>
      </g>
    </svg>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-mark"/></svg>
    <div class="wordmark">Bolecciona<span>Concepción</span></div>
    <p>Los boletos también cuentan la historia de nuestra ciudad.</p>
    <button class="enter" id="enter" type="button">Entrar</button>
    <small>Prototipo con datos de ejemplo</small>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="logo-mark" fill="none" stroke="#33c6f2" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <g transform="rotate(-14 32 32)">
        <path d="M8 18 H56 V27 a5 5 0 0 0 0 10 V46 H8 V37 a5 5 0 0 0 0 -10 Z"/>
        <rect x="20" y="24" width="24" height="15" rx="3"/>
        <path d="M20 31 H44"/>
        <circle cx="26" cy="42" r="1.4" fill="#33c6f2"/><circle cx="38" cy="42" r="1.4" fill="#33c6f2"/>
      </g>
    </g>
  </defs>
</svg>

<script>
(function () {
  /* ---------- Datos de ejemplo (ilustrativos, no son piezas reales) ---------- */
  var P = {
    azul:  { name: 'Azul',     sky: '#3c8dd6', far: '#1f5c99', near: '#16406e', sea: '#2a6fb0', hi: '#f6c453', a2: '#e4572e' },
    turq:  { name: 'Turquesa', sky: '#46b3ae', far: '#23786f', near: '#165852', sea: '#2c8f8c', hi: '#ffe08a', a2: '#e8643c' },
    rojo:  { name: 'Rojo',     sky: '#d9534f', far: '#9a2f3a', near: '#6c1f2e', sea: '#b24556', hi: '#ffe7a8', a2: '#2e6fb0' },
    verde: { name: 'Verde',    sky: '#5cae72', far: '#2f7a52', near: '#1e5238', sea: '#3e9a78', hi: '#ffe9a0', a2: '#d9534f' },
    noche: { name: 'Azul noche', sky: '#1e3a6e', far: '#142a52', near: '#0e1e3e', sea: '#2b4f8a', hi: '#ffd479', a2: '#e4572e' }
  };
  var EMP = [
    { name: 'Buses Tucapel',     head: 'BUSES TUCAPEL',     pals: [P.azul, P.turq, P.noche, P.azul],  scenes: ['ciudad', 'mar', 'ciudad', 'mar'],       comunas: ['Concepción', 'Talcahuano', 'Concepción', 'Hualpén'],           recs: ['Concepción – Talcahuano', 'Talcahuano – Hualpén', 'Concepción – Chiguayante', 'Concepción – Talcahuano'] },
    { name: 'Nueva Llacolén',    head: 'NUEVA LLACOLÉN',    pals: [P.azul, P.noche, P.turq, P.azul],  scenes: ['puente', 'puente', 'puente', 'ciudad'], comunas: ['San Pedro de la Paz', 'Concepción', 'San Pedro de la Paz', 'Concepción'], recs: ['Concepción – San Pedro de la Paz', 'Centro – San Pedro de la Paz', 'Concepción – San Pedro de la Paz', 'Centro – Zócalo'] },
    { name: 'Las Bahías',        head: 'LAS BAHÍAS',        pals: [P.rojo, P.azul, P.rojo, P.verde],  scenes: ['fiesta', 'fiesta', 'fiesta', 'navidad'], comunas: ['Talcahuano', 'Talcahuano', 'Hualpén', 'Talcahuano'],           recs: ['Talcahuano – Concepción', 'Talcahuano – Hualpén', 'Hualpén – Concepción', 'Talcahuano – Concepción'] },
    { name: 'Ruta Las Galaxias', head: 'RUTA LAS GALAXIAS', pals: [P.turq, P.verde, P.azul, P.noche], scenes: ['mar', 'mar', 'ciudad', 'navidad'],       comunas: ['Hualpén', 'Talcahuano', 'Concepción', 'Hualpén'],             recs: ['Hualpén – Concepción', 'Talcahuano – Hualpén', 'Concepción – Hualpén', 'Hualpén – Concepción'] }
  ];
  var TIPOS = ['Adulto', 'Escolar', 'Universitario', 'Adulto mayor', 'Temático'];
  var DEC = ['1990', '2000', '2010', '2020'];
  var NOTAS = {
    mar: 'Diseño con paisaje costero y gaviota, que refleja la identidad marítima de la zona.',
    puente: 'Diseño con un puente atirantado sobre el río, que alude a la unión entre orillas.',
    ciudad: 'Diseño con el perfil de la ciudad al atardecer.',
    fiesta: 'Diseño con banderines de fiestas patrias.',
    navidad: 'Edición con motivos navideños.'
  };
  var TICKETS = [], BYID = {};
  EMP.forEach(function (e, ei) {
    for (var k = 0; k < 4; k++) {
      var n = ei * 4 + k + 1;
      var t = {
        id: 'BC-' + String(n).padStart(4, '0'), n: n, emp: e.name, head: e.head,
        pal: e.pals[k], scene: e.scenes[k], color: e.pals[k].name,
        comuna: e.comunas[k], rec: e.recs[k], dec: DEC[(n + ei) % 4], tipo: TIPOS[(n + k) % 5],
        material: n % 3 === 0 ? null : (n % 2 ? 'Papel térmico' : 'Cartulina'),
        medidas: n % 4 === 0 ? null : (5 + n % 3) + ' × ' + (3 + n % 2) + ' cm',
        confianza: n % 3 === 1 ? 'Alta' : 'Media',
        decEst: n % 5 !== 0,
        proc: n % 2 ? 'Colección del proyecto' : null,
        serial: String(2000000 + (n * 7919 + ei * 104729) % 900000)
      };
      TICKETS.push(t); BYID[t.id] = t;
    }
  });
  function fields(t) {
    var f = [];
    f.push(['Código interno', t.id, 'ok']);
    f.push(['Empresa', t.emp, 'ok']);
    f.push(['Recorrido', t.rec, t.n % 4 === 2 ? 'est' : 'ok']);
    f.push(['Comuna', t.comuna, 'ok']);
    f.push(['Época', 'Década de ' + t.dec, t.decEst ? 'est' : 'ok']);
    f.push(['Tipo', t.tipo, 'ok']);
    f.push(['Color', t.color, 'ok']);
    f.push(['Material', t.material, t.material ? 'ok' : 'pend']);
    f.push(['Medidas', t.medidas, t.medidas ? 'ok' : 'pend']);

        '<div class="notice"><span><b>Ejemplos.</b> Las publicaciones son ficticias. Los comentarios, reportes y la moderación necesitan cuentas de usuario (fase 3).</span></div>' +
        COMMUNITY.map(function (c) {
          return '<div class="note"><div class="hd"><h2>' + esc(c.title) + '</h2><span class="bd ' + c.st + '">' + (c.st === 'res' ? 'Resuelta' : 'Abierta') + '</span></div><p>' + esc(c.text) + '</p><p style="font-size:12px">' + esc(c.who) + ' · ' + c.replies + ' respuestas</p></div>';
        }).join('') +
        '<div class="note"><h2>Qué permitirá la comunidad</h2><ul class="plain"><li>Pedir ayuda para identificar piezas difíciles</li><li>Aportar contexto y comentarios a una ficha</li><li>Reportar datos incorrectos o personales sin autorización</li></ul></div>';
    },
    profile: function () {
      var favs = D.fav.map(function (id) { return BYID[id]; }).filter(Boolean);
      return head('Perfil') +
        '<div class="notice"><span><b>Sin cuenta.</b> Tus favoritos y aportes se guardan solo en este dispositivo. El inicio de sesión es opcional y llega más adelante.</span></div>' +
        '<div class="sec"><h2>Favoritos</h2></div>' +
        (favs.length ? '<div class="grid2" style="margin-bottom:14px">' + favs.map(card).join('') + '</div>' : '<div class="note"><p style="margin:0">Aún no guardas favoritos. Guárdalos desde la ficha de cada boleto.</p></div>') +
        '<div class="sec"><h2>Mis aportes</h2></div>' +
        (D.subs.length ? '<div class="rows" style="margin-bottom:10px">' + D.subs.map(function (s) { return '<div class="row"><span class="tx"><b>' + esc(s.title) + '</b><small>' + esc(s.when) + (s.has ? '' : '') + '</small></span><span class="bd rev">En revisión</span></div>'; }).join('') + '</div>' : '<div class="note"><p style="margin:0">Todavía no has enviado aportes.</p></div>') +
        '<div class="sec"><h2>Proyecto</h2></div>' +
        '<div class="rows"><button class="row" data-a="about"><span class="tx"><b>Acerca del proyecto y contacto</b><small>Propósito, fases, criterios y colaboración</small></span>' + ICON.chev + '</button></div>' +
        '<div class="note" style="margin-top:14px"><h2>Datos de este prototipo</h2><p>Borra tus favoritos y aportes de ejemplo de este dispositivo.</p><div style="margin-top:12px">' +
        (S.confirmReset ? '<p style="margin:0 0 10px;color:var(--fg)">¿Borrar favoritos y aportes?</p><div class="btns row2"><button class="btn warn" data-a="reset">Sí, borrar</button><button class="btn ghost" data-a="cancelreset">Cancelar</button></div>' : '<button class="btn ghost" data-a="askreset">Restablecer prototipo</button>') + '</div></div>';
    },
    about: function () {
      return head('Acerca del proyecto', true) +
        '<div class="note"><h2>Propósito</h2><p>Bolecciona Concepción es una iniciativa digital independiente que quiere registrar, organizar y difundir los boletos de micro del Gran Concepción como objetos de colección y testimonio de la memoria gráfica cotidiana.</p></div>' +
        '<div class="note"><h2>Criterios de catalogación</h2><p>Se prefiere un dato pendiente a uno inventado. Cada dato lleva una de estas marcas:</p><div class="legend" style="margin-top:10px"><span class="bd ok">Confirmado</span><span class="bd est">Estimado</span><span class="bd pend">Pendiente</span></div></div>' +
        '<div class="note"><h2>Fases de desarrollo</h2><div style="margin-top:6px">' +
        '<div class="phase"><em>1</em><div><b>Prototipo</b> (esta versión)<span>Navegación, catálogo de muestra y fichas ilustrativas.</span></div></div>' +
        '<div class="phase"><em>2</em><div><b>Catálogo real</b><span>Base de datos, imágenes, buscador y panel de revisión.</span></div></div>' +
        '<div class="phase"><em>3</em><div><b>Comunidad</b><span>Cuentas, favoritos, aportes, comentarios y moderación.</span></div></div>' +
        '<div class="phase"><em>4</em><div><b>Crecimiento</b><span>Búsqueda visual, estadísticas y alianzas culturales.</span></div></div></div></div>' +
        '<div class="note"><h2>Contacto y colaboración</h2><p>Para donar información, colaborar o patrocinar. La colaboración no transfiere la propiedad de la marca ni del proyecto.</p><div class="copyline"><span>rodrigoschalchli.contacto@gmail.com</span><button data-a="copy" data-val="rodrigoschalchli.contacto@gmail.com">Copiar</button></div></div>' +
        '<div class="note"><h2>Privacidad y condiciones</h2><p>El aviso de privacidad, las condiciones de uso y la atribución de imágenes se redactarán antes de la versión pública.</p></div>';
    }
  };

  /* ---------- Render y navegación ---------- */
  var main = document.getElementById('main'), navEl = document.getElementById('nav');
  var TABS = [
    ['home', 'Inicio', '<svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>'],
    ['cat', 'Catálogo', '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>'],
    ['add', 'Añadir', '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>'],
    ['comm', 'Comunidad', '<svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="9.5" r="2.4"/><path d="M16.5 14.6c2.3 0 3.6 1.4 4 3.8"/></svg>'],
    ['profile', 'Perfil', '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg>']
  ];
  function render(keep) {
    var v = S.stack[S.stack.length - 1], top = main.scrollTop;
    main.innerHTML = VIEWS[v.name](v);
    main.scrollTop = keep ? top : 0;
    navEl.innerHTML = TABS.map(function (t) { return '<button data-a="tab" data-id="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="true"' : '') + '>' + t[2] + t[1] + '</button>'; }).join('');
  }
  function push(v) { S.stack.push(v); S.side = 'front'; S.sugg = false; render(false); }
  function copyText(text) {
    try { navigator.clipboard.writeText(text).then(function () { toast('Correo copiado'); }, function () { toast('Mantén presionado el correo para copiarlo'); }); }
    catch (e) { toast('Mantén presionado el correo para copiarlo'); }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.dataset.a, id = el.dataset.id;
    if (a === 'tab') { S.tab = id; S.stack = [{ name: id }]; S.confirmReset = false; S.formMsg = null; S.sugg = false; render(false); }
    else if (a === 'back') { if (S.stack.length > 1) S.stack.pop(); S.sugg = false; render(false); }
    else if (a === 'ticket') push({ name: 'ticket', id: id });
    else if (a === 'about') push({ name: 'about' });
    else if (a === 'explore') { S.explore = id; render(true); }
    else if (a === 'goexplore') { S.F = { emp: '', rec: '', comuna: '', dec: '', tipo: '', color: '', orden: S.F.orden }; S.F[id] = el.dataset.val; S.fopen = false; S.tab = 'cat'; S.stack = [{ name: 'cat' }]; render(false); }
    else if (a === 'ftoggle') { S.fopen = !S.fopen; render(true); }
    else if (a === 'clearf') { S.F[id] = ''; render(true); }
    else if (a === 'clearall') { ['emp', 'rec', 'comuna', 'dec', 'tipo', 'color'].forEach(function (k) { S.F[k] = ''; }); render(true); }
    else if (a === 'side') { S.side = id; render(true); }
    else if (a === 'fav') {
      var i = D.fav.indexOf(id);
      if (i > -1) { D.fav.splice(i, 1); toast('Quitado de favoritos'); } else { D.fav.push(id); toast('Guardado en favoritos'); }
      save(); render(true);
    }
    else if (a === 'sugg') { S.sugg = true; render(true); }
    else if (a === 'cancelsugg') { S.sugg = false; render(true); }
    else if (a === 'sendsugg') {
      var ta = document.getElementById('sg');
      if (!ta || !ta.value.trim()) { toast('Escribe qué dato corregirías'); return; }
      S.sugg = false; render(true); toast('Sugerencia registrada en este prototipo');
    }
    else if (a === 'copy') copyText(el.dataset.val);
    else if (a === 'askreset') { S.confirmReset = true; render(true); }
    else if (a === 'cancelreset') { S.confirmReset = false; render(true); }
    else if (a === 'reset') { D = { fav: [], subs: [] }; save(); S.confirmReset = false; render(true); toast('Prototipo restablecido'); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { S.query = e.target.value; document.getElementById('homeBody').innerHTML = homeBody(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.f) { S.F[t.dataset.f] = t.value; var box = document.getElementById('catList'); if (box) box.innerHTML = catResults(); }
    else if (t.id === 'f-front' || t.id === 'f-back') {
      var side = t.id === 'f-front' ? 'front' : 'back', file = t.files && t.files[0];
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        S.pv[side] = String(fr.result);
        var vals = ['f-emp', 'f-rec', 'f-fecha', 'f-notas'].map(function (id) { var x = document.getElementById(id); return x ? x.value : ''; });
        var der = document.getElementById('f-der') && document.getElementById('f-der').checked;
        render(true);
        ['f-emp', 'f-rec', 'f-fecha', 'f-notas'].forEach(function (id, i) { var x = document.getElementById(id); if (x) x.value = vals[i]; });
        var d = document.getElementById('f-der'); if (d) d.checked = der;
      };
      fr.readAsDataURL(file);
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'addform') return;
    e.preventDefault();
    var emp = document.getElementById('f-emp').value.trim(), rec = document.getElementById('f-rec').value.trim(), fecha = document.getElementById('f-fecha').value.trim();
    var der = document.getElementById('f-der').checked;
    if (!S.pv.front) { S.formMsg = { k: 'err', t: 'Falta la foto del frente. Es obligatoria para publicar.' }; }
    else if (!emp && !rec) { S.formMsg = { k: 'err', t: 'Indica al menos la empresa o el recorrido.' }; }
    else if (!der) { S.formMsg = { k: 'err', t: 'Debes confirmar que tienes derecho a compartir las imágenes.' }; }
    else {
      D.subs.unshift({ title: emp || rec, when: (fecha ? fecha + ' · ' : '') + 'enviado hoy' });
      save(); S.pv = { front: '', back: '' };
      S.formMsg = { k: 'good', t: 'Aporte enviado a revisión. Lo verás en tu perfil con estado “En revisión”.' };
      render(false); toast('Aporte enviado a revisión'); return;
    }
    var keep = { e: document.getElementById('f-emp').value, r: document.getElementById('f-rec').value, f: document.getElementById('f-fecha').value, n: document.getElementById('f-notas').value };
    render(true);
    document.getElementById('f-emp').value = keep.e; document.getElementById('f-rec').value = keep.r; document.getElementById('f-fecha').value = keep.f; document.getElementById('f-notas').value = keep.n; document.getElementById('f-der').checked = der;
  });
  document.getElementById('enter').addEventListener('click', function () {
    var sp = document.getElementById('splash'); sp.classList.add('gone');
    setTimeout(function () { sp.hidden = true; }, 400);
  });

  render(false);
})();
</script>

</body>
</html>
